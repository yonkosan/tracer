zerops:
  - setup: api
    build:
      base: nodejs@22
      buildCommands:
        - cd apps/api && npm ci
        - cd apps/api && npm run build
        - cp apps/api/src/db/schema.sql apps/api/dist/db/schema.sql
        - mkdir -p deploy/api
        - cp -r apps/api/dist/. deploy/api/
        - cp -r apps/api/node_modules deploy/api/node_modules
        - cp apps/api/package.json deploy/api/package.json
      deployFiles:
        - deploy/api/~
      cache:
        - apps/api/node_modules
    run:
      base: nodejs@22
      ports:
        - port: 3001
          httpSupport: true
      start: node server.js
      readinessCheck:
        httpGet:
          port: 3001
          path: /health

  - setup: web
    build:
      base: nodejs@22
      buildCommands:
        - cd apps/web && npm ci
        - cd apps/web && npm run build
        - mkdir -p deploy/web
        - cp -r apps/web/.next deploy/web/.next
        - cp -r apps/web/public deploy/web/public
        - cp -r apps/web/node_modules deploy/web/node_modules
        - cp apps/web/package.json deploy/web/package.json
        - cp apps/web/next.config.ts deploy/web/next.config.ts
      deployFiles:
        - deploy/web/~
      cache:
        - apps/web/node_modules
    run:
      base: nodejs@22
      ports:
        - port: 3000
          httpSupport: true
      envVariables:
        NODE_ENV: production
        NEXT_PUBLIC_API_URL: https://api-2c50.prg1.zerops.app
      start: node_modules/.bin/next start -p 3000
      readinessCheck:
        httpGet:
          port: 3000
          path: /
