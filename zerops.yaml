zerops:
  - setup: api
    build:
      base: nodejs@22
      buildCommands:
        - cd apps/api && npm ci
        - cd apps/api && npm run build
        - cp apps/api/src/db/schema.sql apps/api/dist/db/schema.sql
      deployFiles:
        - apps/api/dist/~
        - apps/api/package.json
      cache:
        - apps/api/node_modules
    run:
      base: nodejs@22
      ports:
        - port: 3001
          httpSupport: true
      initCommands:
        - npm install --production --ignore-scripts
      start: node dist/server.js
      readinessCheck:
        httpGet:
          port: 3001
          path: /health

  - setup: web
    build:
      base: nodejs@22
      buildCommands:
        - cd apps/web && npm ci
        - cd apps/web && npm run build
      deployFiles:
        - apps/web/.next/~
        - apps/web/public/~
        - apps/web/next.config.ts
        - apps/web/package.json
      cache:
        - apps/web/node_modules
    run:
      base: nodejs@22
      ports:
        - port: 3000
          httpSupport: true
      envVariables:
        NODE_ENV: production
        NEXT_PUBLIC_API_URL: https://api-2c50.prg1.zerops.app
      initCommands:
        - npm install --production --ignore-scripts
      start: node_modules/.bin/next start -p 3000
      readinessCheck:
        httpGet:
          port: 3000
          path: /
