zerops:
  - setup: api
    build:
      base: nodejs@22
      buildCommands:
        - cd apps/api && npm ci
        - cd apps/api && npm run build
        - cp apps/api/src/db/schema.sql apps/api/dist/db/schema.sql
        - cd apps/api && npm prune --omit=dev
        - cp -r apps/api/dist dist
        - cp -r apps/api/node_modules node_modules
        - cp apps/api/package.json package.json
      deployFiles:
        - dist
        - node_modules
        - package.json
      cache:
        - apps/api/node_modules
    deploy:
      readinessCheck:
        httpGet:
          port: 3001
          path: /health
    run:
      base: nodejs@22
      ports:
        - port: 3001
          httpSupport: true
      envVariables:
        NODE_ENV: production
        DB_HOST: db
        DB_PORT: ${db_port}
        DB_USER: ${db_user}
        DB_PASSWORD: ${db_password}
        DB_NAME: ${db_dbName}
        REDIS_HOST: cache
        REDIS_PORT: ${cache_port}
        NATS_URL: nats://${broker_user}:${broker_password}@broker:${broker_port}
        ES_URL: http://search:${search_port}
        ES_USER: elastic
        ES_PASSWORD: ${search_password}
      start: node dist/server.js
      healthCheck:
        httpGet:
          port: 3001
          path: /health

  - setup: web
    build:
      base: nodejs@22
      buildCommands:
        - npm ci
        - npm run build --workspace=apps/web
        - npm prune --omit=dev
        - mkdir -p public
        - cp -r apps/web/public/. public/ || true
      deployFiles:
        - apps/web/.next
        - public
        - node_modules
        - apps/web/package.json
        - apps/web/next.config.ts
      cache:
        - node_modules
    deploy:
      readinessCheck:
        httpGet:
          port: 3000
          path: /
    run:
      base: nodejs@22
      ports:
        - port: 3000
          httpSupport: true
      envVariables:
        NODE_ENV: production
        NEXT_PUBLIC_API_URL: https://api-2c50.prg1.zerops.app
      start: node_modules/.bin/next start apps/web -p 3000
      healthCheck:
        httpGet:
          port: 3000
          path: /
